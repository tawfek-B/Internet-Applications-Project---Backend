; Performance settings for load testing on Docker Desktop (Windows bind mount).
; With validate_timestamps=0 PHP stops re-checking every source file on each
; request, which is very slow through the Windows file share.
; After editing PHP code, restart the container: docker compose restart laravel.test
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
realpath_cache_size=4096K
realpath_cache_ttl=600
