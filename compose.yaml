# Shared environment for every Laravel container (web instances + workers).
# Defined once so the three instances can't drift apart.
x-laravel-env: &laravel-env
    WWWUSER: '${WWWUSER:-1000}'
    LARAVEL_SAIL: 1
    PHP_CLI_SERVER_WORKERS: 4
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: '3306'
    DB_DATABASE: '${DB_DATABASE}'
    DB_USERNAME: '${DB_USERNAME}'
    DB_PASSWORD: '${DB_PASSWORD}'
    DB_WRITE_HOST: mysql
    DB_READ_HOST: '${DB_READ_HOST:-mysql}'
    DB_STICKY: 'true'
    APP_URL: '${APP_URL:-http://localhost:8000}'
    INVENTORY_DRIVER: http
    INVENTORY_HTTP_URL: http://inventory:50052
    INVENTORY_GRPC_HOST: inventory:50051
    CACHE_STORE: redis
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    SESSION_DRIVER: database
    QUEUE_CONNECTION: rabbitmq
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: '5672'
    RABBITMQ_USER: sail
    RABBITMQ_PASSWORD: password
    CATALOG_CACHE_ENABLED: 'true'
    FILESYSTEM_DISK: public

x-laravel-depends: &laravel-depends
    mysql:
        condition: service_healthy
    redis:
        condition: service_healthy
    rabbitmq:
        condition: service_healthy
    inventory:
        condition: service_started

services:
    nginx:
        image: nginx:alpine
        ports:
            - '8000:80'
        volumes:
            - './docker/nginx:/etc/nginx/conf.d:ro'
        depends_on:
            - laravel1
            - laravel2
            - laravel3
        networks:
            - sail

    laravel1: &laravel-app
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        env_file:
            - .env.docker
        environment:
            <<: *laravel-env
            APP_INSTANCE: laravel1
        volumes:
            - '.:/var/www/html'
            - 'sail-storage:/var/www/html/storage/app/public'
            - './docker/php/99-performance.ini:/etc/php/8.5/cli/conf.d/99-performance.ini:ro'
        networks:
            - sail
        depends_on: *laravel-depends

    laravel2:
        <<: *laravel-app
        environment:
            <<: *laravel-env
            APP_INSTANCE: laravel2

    laravel3:
        <<: *laravel-app
        environment:
            <<: *laravel-env
            APP_INSTANCE: laravel3

    worker1:
        <<: *laravel-app
        command: >
            sh -c "php artisan rabbitmq:queue-declare default rabbitmq &&
                   php artisan rabbitmq:consume --sleep=1 --tries=3 --timeout=60"
        restart: unless-stopped
        environment:
            <<: *laravel-env
            APP_INSTANCE: worker1
        depends_on: *laravel-depends

    worker2:
        <<: *laravel-app
        command: >
            sh -c "php artisan rabbitmq:queue-declare default rabbitmq &&
                   php artisan rabbitmq:consume --sleep=1 --tries=3 --timeout=60"
        restart: unless-stopped
        environment:
            <<: *laravel-env
            APP_INSTANCE: worker2
        depends_on: *laravel-depends

    worker3:
        <<: *laravel-app
        command: >
            sh -c "php artisan rabbitmq:queue-declare default rabbitmq &&
                   php artisan rabbitmq:consume --sleep=1 --tries=3 --timeout=60"
        restart: unless-stopped
        environment:
            <<: *laravel-env
            APP_INSTANCE: worker3
        depends_on: *laravel-depends

    inventory:
        build:
            context: ./inventory-service
            dockerfile: Dockerfile
        expose:
            - "50051"
            - "50052"
        volumes:
            - './proto:/proto:ro'
        environment:
            GRPC_PORT: '50051'
            INVENTORY_HTTP_PORT: '50052'
            INVENTORY_HTTP_BIND: '0.0.0.0'
            PROTO_PATH: /proto/inventory.proto
            INVENTORY_DB_DRIVER: mysql
            INVENTORY_MYSQL_HOST: inventory-mysql
            INVENTORY_MYSQL_PORT: '3306'
            INVENTORY_MYSQL_DATABASE: inventory
            INVENTORY_MYSQL_USER: '${INVENTORY_DB_USERNAME:-inventory}'
            INVENTORY_MYSQL_PASSWORD: '${INVENTORY_DB_PASSWORD:-inventory}'
        networks:
            - sail
        restart: on-failure
        depends_on:
            inventory-mysql:
                condition: service_healthy

    inventory-mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_INVENTORY_DB_PORT:-3309}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${INVENTORY_DB_ROOT_PASSWORD:-inventory_root}'
            MYSQL_DATABASE: inventory
            MYSQL_USER: '${INVENTORY_DB_USERNAME:-inventory}'
            MYSQL_PASSWORD: '${INVENTORY_DB_PASSWORD:-inventory}'
        volumes:
            - 'inventory-mysql:/var/lib/mysql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-h'
                - '127.0.0.1'
                - '-p${INVENTORY_DB_ROOT_PASSWORD:-inventory_root}'
            retries: 10
            timeout: 5s
            interval: 5s
            start_period: 30s

    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3307}:3306'
        command: --server-id=1 --log-bin=mysql-bin --binlog-format=ROW
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
            - './docker/mysql/15-replication-user.sql:/docker-entrypoint-initdb.d/15-replication-user.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 10
            timeout: 5s
            interval: 5s
            start_period: 30s

    mysql-read:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_READ_PORT:-3310}:3306'
        command: --server-id=2 --relay-log=relay-bin --skip-replica-start
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql-read:/var/lib/mysql'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 10
            timeout: 5s
            interval: 5s
            start_period: 30s

    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6380}:6379'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

    rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
            - '${FORWARD_RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
        environment:
            RABBITMQ_DEFAULT_USER: sail
            RABBITMQ_DEFAULT_PASS: password
        volumes:
            - 'sail-rabbitmq:/var/lib/rabbitmq'
        networks:
            - sail
        healthcheck:
            test: rabbitmq-diagnostics -q ping
            retries: 5
            timeout: 10s
            interval: 10s
            start_period: 20s

    reverb:
        image: sail-8.5/app
        command: php artisan reverb:start --host=0.0.0.0 --port=8080 --debug
        ports:
            - '${REVERB_PORT:-8080}:8080'
        env_file:
            - .env.docker
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            REDIS_HOST: redis
            REDIS_PORT: '6379'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            redis:
                condition: service_healthy

networks:
    sail:
        driver: bridge

volumes:
    sail-mysql:
        driver: local
    sail-mysql-read:
        driver: local
    inventory-mysql:
        driver: local
    sail-rabbitmq:
        driver: local
    sail-storage:
        driver: local