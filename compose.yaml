# Docker-only: Laravel + inventory + MySQL. API: http://127.0.0.1:8000
services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '8000:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        env_file:
            - .env.docker
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: '3306'
            DB_DATABASE: '${DB_DATABASE}'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
            APP_URL: '${APP_URL:-http://localhost:8000}'
            INVENTORY_DRIVER: http
            INVENTORY_HTTP_URL: http://inventory:50052
            INVENTORY_GRPC_HOST: inventory:50051
            CACHE_STORE: redis
            REDIS_HOST: redis
            REDIS_PORT: '6379'
            SESSION_DRIVER: cookie
            DB_WRITE_HOST: mysql
            DB_READ_HOST: '${DB_READ_HOST:-mysql}'
            DB_STICKY: 'true'
            CATALOG_CACHE_ENABLED: 'true'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
            inventory:
                condition: service_started
    inventory:
        build:
            context: ./inventory-service
            dockerfile: Dockerfile
        ports:
            - '${INVENTORY_PORT:-50051}:50051'
            - '${INVENTORY_HTTP_PORT:-50052}:50052'
        volumes:
            - './proto:/proto:ro'
        environment:
            GRPC_PORT: '50051'
            INVENTORY_HTTP_PORT: '50052'
            INVENTORY_HTTP_BIND: '0.0.0.0'
            PROTO_PATH: /proto/inventory.proto
            INVENTORY_DB_DRIVER: mysql
            INVENTORY_MYSQL_HOST: mysql
            INVENTORY_MYSQL_PORT: '3306'
            INVENTORY_MYSQL_DATABASE: inventory
            INVENTORY_MYSQL_USER: '${DB_USERNAME}'
            INVENTORY_MYSQL_PASSWORD: '${DB_PASSWORD}'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3307}:3306'
        command: --server-id=1 --log-bin=mysql-bin --binlog-format=ROW
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
            - './docker/mysql/15-replication-user.sql:/docker-entrypoint-initdb.d/15-replication-user.sql'
            - './docker/mysql/20-create-inventory-database.sql:/docker-entrypoint-initdb.d/20-create-inventory-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 10
            timeout: 5s
            interval: 5s
            start_period: 30s
    mysql-read:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_READ_PORT:-3308}:3306'
        command: --server-id=2 --relay-log=relay-bin --skip-slave-start
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql-read:/var/lib/mysql'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 10
            timeout: 5s
            interval: 5s
            start_period: 30s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-mysql-read:
        driver: local
