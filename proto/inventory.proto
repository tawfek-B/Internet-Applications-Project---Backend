syntax = "proto3";
package inventory;

service InventoryService {
  rpc GetQuantity(GetQuantityRequest) returns (GetQuantityResponse);
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
  rpc SetQuantity(SetQuantityRequest) returns (SetQuantityResponse);
}

message GetQuantityRequest { int64 product_id = 1; }
message GetQuantityResponse { int64 product_id = 1; int32 available = 2; }

message ReserveItem { int64 product_id = 1; int32 quantity = 2; }
message ReserveRequest {
  string reservation_id = 1;
  repeated ReserveItem items = 2;
}
message ReserveResponse {
  bool success = 1;
  string message = 2;
  string reservation_id = 3;
}

message ReleaseRequest { string reservation_id = 1; }
message ReleaseResponse { bool success = 1; string message = 2; }

message SetQuantityRequest { int64 product_id = 1; int32 quantity = 2; }
message SetQuantityResponse { bool success = 1; int32 available = 2; }
